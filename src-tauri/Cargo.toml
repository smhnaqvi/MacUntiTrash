[package]
name = "spaceglance"
version = "0.1.8"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde_json = "1"
tauri-plugin-dialog = "2"
walkdir = "2"
trash = "5"
libc = "0.2"
objc2-foundation = { version = "0.3", features = ["NSURL", "NSString", "NSData", "NSError", "NSArray"] }
objc2 = "0.6"

[[bin]]
name = "spaceglance"
path = "src/main.rs"
