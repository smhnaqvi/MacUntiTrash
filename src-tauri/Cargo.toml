[package]
name = "disk-detective"
version = "0.1.6"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Used directly (not the tauri-plugin-shell plugin) so trash/reveal/open
# calls are ordinary Rust code we control, with no plugin permission-scope
# guesswork. tauri::async_runtime::spawn schedules onto Tauri's own tokio
# runtime, so these tokio types just need to be in scope — no second
# runtime is started.
tokio = { version = "1", features = ["process", "io-util", "rt-multi-thread"] }

[[bin]]
name = "disk-detective"
path = "src/main.rs"
